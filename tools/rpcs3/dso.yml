  "dso key A @0x17FB338 (ds3os/PC login key)":
    Games:
      "DARK SOULS II":
        BLUS41045: [ All ]
    Author: "dso"
    Patch Version: "1.0"
    Notes: |
      Replaces ONLY the RSA public key at vaddr 0x17FB338 (file 0x17EB338).
      2048-bit, e=3, modulus xSeDuBTm3Ayt... This is byte-identical to the key
      ds3os searches for and overwrites on PC DS2, i.e. their login key.
      Field is 426 bytes; our PEM is exactly 426, so it is a byte-for-byte swap.
      NOTE: enabling this alone appeared to break the calibration step, which
      suggests this key is also used to verify the calibration/regulation blob.
    Patch:
      - [ utf8, 0x17FB338, "-----BEGIN RSA PUBLIC KEY-----\nMIIBCAKCAQEA0XntyKjMSs7toA2mb6xRr5BxII66LtrwDwbNr4bWk1JFH5xpriHv\ng80stuo+7Uqr6H7SbWfxVWM9dLZ64Lr6YZXJUIbXR/9c92SIcgE+tOo3S1tpEwIL\nXWmoiijJ/uwOn0coHKp2Q3WHTWwDhL1TXiA22TETli6X3qdMWlscZmRHOrexAzf7\nimGWETUbqqdNd/NupSt5OgPmgRVJKRXRmWjVIZfIfuaqAnUDJa00GnXBfrCoE/B+\nvSiARL1Yff/yw7ks1rhBpVfEFLV0QnSTjDVsv4143nPR7ngbLMEdhbsI78rsBALM\nVgPb3LzxzMW/pSIVcWYZ8+sbjWpKn0v7sQIBAw==\n-----END RSA PUBLIC KEY-----\n" ]

  "dso key B @0x189AB48":
    Games:
      "DARK SOULS II":
        BLUS41045: [ All ]
    Author: "dso"
    Patch Version: "1.0"
    Notes: |
      Replaces ONLY the RSA public key at vaddr 0x189AB48 (file 0x188AB48).
      2048-bit, e=3, modulus luKyYootlsum... A different key from the one at
      0x17FB338 - not a duplicate.
      Field is 426 bytes; our PEM is exactly 426, so it is a byte-for-byte swap.
      NOTE: with only this enabled the game still reached the login service, but
      the 256-byte RSA block did not decrypt with our private key - so this is
      probably NOT the login key.
