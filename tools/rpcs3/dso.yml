Version: 1.2

# dso RSA key patches for Dark Souls II (BLUS41045).
#
# The client encrypts its login/auth stream with an RSA public key embedded in
# the EBOOT, and only the matching private key can decrypt it. That private key
# is FromSoftware's, so the public key is replaced with one we generated
# (2048-bit, e=3) whose private half the server holds.
#
# WHY THESE ARE PER-VERSION
#
# The top-level key is the PPU executable hash, which identifies one exact
# EBOOT. A patch written for the launch disc therefore does NOT apply after a
# title update: different executable, different hash, different addresses.
#
# The symptom is specific and worth recognising -- the server logs
#
#     login stream failed  err="message: decrypt: crypto/rsa: decryption error"
#
# which means the patch silently did not apply and the client is still using
# FromSoftware's key. The game just hangs on login and fails.
#
# Blocks for different versions coexist safely: RPCS3 applies only the one
# matching the executable actually running, so every version can stay enabled
# and you can switch title updates freely.
#
# The keys themselves did NOT change between 1.00 and 1.10 -- both versions
# embed the same two, byte for byte (verified by hashing the 426-byte fields).
# Only their addresses moved.
#
# Version lists are left as [ All ] deliberately. The hash already pins the
# executable exactly, so restricting by version only adds a second way to
# silently not apply.
#
# TO ADD ANOTHER GAME VERSION
#
#   1. Boot it once and read the hash from the RPCS3 log:
#        grep -aoE "PPU-[0-9a-f]{40}" log/RPCS3.log | sort -u
#   2. Decrypt that version's EBOOT: RPCS3 > Utilities > Decrypt PS3 Binaries,
#      on dev_hdd0/game/BLUS41045/USRDIR/EBOOT.BIN for an update, or the disc
#      EBOOT for a base version.
#   3. Locate the keys and convert file offset to vaddr by adding 0x10000:
#        grep -abo -- "-----BEGIN RSA PUBLIC KEY-----" EBOOT.elf
#   4. Identify which is which by hashing 426 bytes at each offset and matching
#      against the table below -- do NOT rely on their order.
#
#        login key       sha1 defce3e3a6b14ebd...
#        calibration key sha1 c7b123785a6d7ec9...
#
# The field is 426 bytes and our PEM is exactly 426, so every patch here is a
# byte-for-byte swap that cannot shift anything around it.

# =============================================================================
# v1.00 -- launch disc
# =============================================================================
PPU-efd8e00902c586ebf88f5c97dcbdfe27bdce3bcc:

  "dso v1.00: login RSA key @0x17FB338":
    Games:
      "DARK SOULS II":
        BLUS41045: [ All ]
    Author: "dso"
    Patch Version: "1.0"
    Notes: |
      THIS IS THE ONE YOU WANT on v1.00. Replaces the RSA public key at vaddr
      0x17FB338 (file 0x17EB338), byte-identical to the key ds3os searches for
      and overwrites on PC DS2 -- i.e. their login key.

      Enabling this alone was observed to break the calibration step, which
      suggests the same key also verifies the calibration/regulation payloads.
    Patch:
      - [ utf8, 0x17FB338, "-----BEGIN RSA PUBLIC KEY-----\nMIIBCAKCAQEA0XntyKjMSs7toA2mb6xRr5BxII66LtrwDwbNr4bWk1JFH5xpriHv\ng80stuo+7Uqr6H7SbWfxVWM9dLZ64Lr6YZXJUIbXR/9c92SIcgE+tOo3S1tpEwIL\nXWmoiijJ/uwOn0coHKp2Q3WHTWwDhL1TXiA22TETli6X3qdMWlscZmRHOrexAzf7\nimGWETUbqqdNd/NupSt5OgPmgRVJKRXRmWjVIZfIfuaqAnUDJa00GnXBfrCoE/B+\nvSiARL1Yff/yw7ks1rhBpVfEFLV0QnSTjDVsv4143nPR7ngbLMEdhbsI78rsBALM\nVgPb3LzxzMW/pSIVcWYZ8+sbjWpKn0v7sQIBAw==\n-----END RSA PUBLIC KEY-----\n" ]

  "dso v1.00: calibration RSA key @0x189AB48":
    Games:
      "DARK SOULS II":
        BLUS41045: [ All ]
    Author: "dso"
    Patch Version: "1.0"
    Notes: |
      The SECOND key, at vaddr 0x189AB48 (file 0x188AB48). With only this
      enabled the game reached the login service but the RSA block did not
      decrypt, so this is NOT the login key.

      It verifies the calibration payloads: the request builder at 0x01673D5C
      loads it from mini-TOC slot 0x1CC27E8 alongside the AES and HMAC keys and
      passes it to the fetch for contents_NNNN.bin.

      LEAVE THIS OFF unless deliberately experimenting with self-authored
      calibrations. Replacing it breaks verification of FromSoftware's real
      payloads, and we cannot yet author replacements -- the 256-byte RSA header
      that carries the AES IV is not solved.
    Patch:
      - [ utf8, 0x189AB48, "-----BEGIN RSA PUBLIC KEY-----\nMIIBCAKCAQEA0XntyKjMSs7toA2mb6xRr5BxII66LtrwDwbNr4bWk1JFH5xpriHv\ng80stuo+7Uqr6H7SbWfxVWM9dLZ64Lr6YZXJUIbXR/9c92SIcgE+tOo3S1tpEwIL\nXWmoiijJ/uwOn0coHKp2Q3WHTWwDhL1TXiA22TETli6X3qdMWlscZmRHOrexAzf7\nimGWETUbqqdNd/NupSt5OgPmgRVJKRXRmWjVIZfIfuaqAnUDJa00GnXBfrCoE/B+\nvSiARL1Yff/yw7ks1rhBpVfEFLV0QnSTjDVsv4143nPR7ngbLMEdhbsI78rsBALM\nVgPb3LzxzMW/pSIVcWYZ8+sbjWpKn0v7sQIBAw==\n-----END RSA PUBLIC KEY-----\n" ]

# =============================================================================
