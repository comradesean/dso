version: v2
managed:
  enabled: true
  override:
    # Inject go_package externally so the vendored .proto files stay pristine.
    - file_option: go_package
      path: Shared_Frpg2RequestMessage.proto
      value: github.com/sstreight/dso/internal/proto/sharedpb
    - file_option: go_package
      path: DS2_Frpg2PlayerData.proto
      value: github.com/sstreight/dso/internal/proto/ds2datapb
    - file_option: go_package
      path: DS2_Frpg2RequestMessage.proto
      value: github.com/sstreight/dso/internal/proto/ds2pb
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/sstreight/dso
