version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The reference protos are reverse-engineered and don't follow buf's naming
  # conventions; we keep them verbatim rather than lint-clean.
  disallow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_LOWER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - MESSAGE_PASCAL_CASE
    - ENUM_PASCAL_CASE
breaking:
  use:
    - FILE
